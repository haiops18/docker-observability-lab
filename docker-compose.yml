name: docker-observability-lab

services:
  grafana:
    image: grafana/grafana:11.5.2
    container_name: obs-grafana
    user: "472:472"
    ports:
      - "3000:3000"
    networks:
      - observability_frontend
      - observability_backend
    volumes:
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      PROMETHEUS_BASIC_AUTH_USER: "${PROMETHEUS_BASIC_AUTH_USER:-admin}"
      PROMETHEUS_BASIC_AUTH_PASSWORD: "${PROMETHEUS_BASIC_AUTH_PASSWORD:?Set PROMETHEUS_BASIC_AUTH_PASSWORD in .env}"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: obs-prometheus
    user: "65534:65534"
    ports:
      - "9090:9090"
    networks:
      - observability_backend
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - ./config/prometheus/web.yml:/etc/prometheus/web.yml:ro
      - ./secrets/prometheus_password:/etc/prometheus/secrets/prometheus_password:ro
      - prometheus_data:/prometheus
    environment:
      PROMETHEUS_BASIC_AUTH_USER: "${PROMETHEUS_BASIC_AUTH_USER:-admin}"
      PROMETHEUS_BASIC_AUTH_PASSWORD: "${PROMETHEUS_BASIC_AUTH_PASSWORD:?Set PROMETHEUS_BASIC_AUTH_PASSWORD in .env}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.config.file=/etc/prometheus/web.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=20GB"
      - "--web.enable-lifecycle"
    depends_on:
      alertmanager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "AUTH=$$(printf '%s:%s' \"$$PROMETHEUS_BASIC_AUTH_USER\" \"$$PROMETHEUS_BASIC_AUTH_PASSWORD\" | base64 | tr -d '\\n'); wget -q --spider --header=\"Authorization: Basic $$AUTH\" http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: obs-alertmanager
    user: "65534:65534"
    ports:
      - "9093:9093"
    networks:
      - observability_backend
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--data.retention=120h"
      - "--web.listen-address=0.0.0.0:9093"
      - "--cluster.listen-address="
      - "--log.level=info"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: obs-node-exporter
    user: "65534:65534"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - observability_backend
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--web.listen-address=0.0.0.0:9100"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/docker/netns|var/lib/docker/.+)($$|/)"
      - "--collector.netdev.device-exclude=^(veth.*|br.*|docker.*|lo)$$"
      - "--no-collector.wifi"
      - "--no-collector.hwmon"
      - "--no-collector.btrfs"
      - "--no-collector.zfs"
      - "--log.level=info"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: obs-cadvisor
    privileged: false
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    networks:
      - observability_backend
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg:ro
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--disable_metrics=advtcp,cpuLoad,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp"
      - "--allow_dynamic_housekeeping=true"
      - "--global_housekeeping_interval=1m0s"
      - "--max_housekeeping_interval=1m0s"
      - "--event_storage_event_limit=default=0"
      - "--event_storage_age_limit=default=0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: obs-loki
    user: "10001:10001"
    ports:
      - "3100:3100"
    networks:
      - observability_backend
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    container_name: obs-promtail
    user: "0:0"
    networks:
      - observability_backend
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/log/journal:/run/log/journal:ro
      - promtail_positions:/var/lib/promtail
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    depends_on:
      loki:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    container_name: obs-tempo
    user: "10001:10001"
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - observability_backend
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  observability_frontend:
    name: observability_frontend
    driver: bridge

  observability_backend:
    name: observability_backend
    driver: bridge

volumes:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  promtail_positions:
  tempo_data:
