global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: lab
    project: docker-observability-lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    scheme: http
    metrics_path: /metrics
    basic_auth:
      username: admin
      password_file: /etc/prometheus/secrets/prometheus_password
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: node-exporter
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter

  - job_name: cadvisor
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: cadvisor
