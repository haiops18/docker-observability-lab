server:
  http_listen_address: 0.0.0.0
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  - job_name: "system-logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "system-logs"
          host: "docker-lab"
          __path__: /var/log/dpkg.log

  - job_name: "docker-container-logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "docker-container-logs"
          host: "docker-lab"
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - drop:
          older_than: 1h
          drop_counter_reason: stale_docker_log
      - labels:
          stream:
      - output:
          source: output
